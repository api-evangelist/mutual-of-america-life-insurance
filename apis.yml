description: >-
  Mutual of America Life Insurance Company is a mutual life insurance and retirement services
  provider headquartered in New York City, offering employer-sponsored retirement plans —
  401(k), 403(b), 401(a) and 457 deferred compensation — alongside individual retirement
  products including Traditional, Roth, Rollover, Managed, Self-Select and Inherited IRAs,
  flexible premium annuities and interest-account and investment options. It serves nonprofit,
  business, governmental and tribal employers and their employees through a plan
  administration portal, payroll integration services, online enrollment and salary deferral,
  and automatic enrollment. Mutual of America publishes no public developer program, API
  reference or machine-readable API contract; the only machine-readable discovery documents it
  serves are the OpenID Connect and OAuth 2.0 authorization-server metadata on its customer
  identity host, login.mutualofamerica.com.
